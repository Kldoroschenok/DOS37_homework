---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: yes

- name: Set timezone
  community.general.timezone:
    name: "{{ ntp_timezone }}"

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart chrony

- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: yes
