services:
  auth:
    build: ./auth
    ports:
      - "8081:8080"

  pay:
    build: ./pay
    ports:
      - "8082:8080"

  nginx:
    build: ./nginx
    ports:
      - "8083:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - pay
